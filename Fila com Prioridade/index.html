<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila Prioridade - Lab 02</title>
</head>

<body>
    <div id="main" class="h-screen flex items-center justify-center flex-col ">
        <div class="bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4 w-1/2 h-3/4">
            <h1 class="text-xl font-extrabold leading-normal my-10 "> Lab 02 - Fila com prioridade</h1>

            <div class="mb-4 ">
                <label for="elemento"> Digite um valor </label>
                <br>
                <input class="w-1/2 py-2 px-4 text-gray-700  focus:outline-none focus:shadow-outline" type="text"
                    name="elemento" id="elemento" list="emocoes">
                <br> <br>
                <label for="prioridade">Prioridade: </label>
                <br>
                <input class="w-1/2 py-2 px-4 text-gray-700  focus:outline-none focus:shadow-outline" type="text"
                    name="prioridade" id="prioridade" list="emocoes">

            </div>
            <div>
                <p> Selecione uma operação para realizar sobre a fila</p>
                <div class="flex justify-between ">
                    <input type="button"
                        class="bg-blue-500 :bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline "
                        value="enfileirar" id="enfileirar">

                    <input type="button"
                        class="bg-blue-500 :bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        value="desenfileirar" id="desenfileirar">

                    <input type="button"
                        class="bg-blue-500 :bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        value="primeiro" id="primeiro">

                    <input type="button"
                        class="bg-blue-500 :bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        value="tamanho" id="tamanho">

                    <input type="button"
                        class="bg-blue-500 :bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        value="vazio" id="vazio">
                </div>


            </div>

            <p class="mt-10 "> Variável: meuArray </p>
            <div id="meuArray" class="bg-sky-700 shadow-md rounded p-2  h-20  flex justify-start">

            </div>
        </div>



    </div>
    <script src="script.js" type="module"></script>/>
    <script src="https://cdn.tailwindcss.com"></script>
</body>

</html>
